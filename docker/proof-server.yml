# Local proof server matching the Preview / Preprod / Mainnet component matrix
# (proof server 8.1.0, ledger 8). Required for deploy and every circuit call.
services:
  proof-server:
    image: 'midnightntwrk/proof-server:8.1.0'
    command: ['midnight-proof-server -v']
    ports:
      - '6300:6300'
    environment:
      RUST_BACKTRACE: 'full'
